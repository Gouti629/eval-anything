[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-anything"
version = "0.1.0"
description = "Lightweight LLM evaluation harness with vLLM-accelerated inference"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.0",
    "tqdm",
    "numpy",
    "matplotlib",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Gouti629/eval-anything"

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
test = ["pytest>=7.0"]
lint = ["ruff>=0.4"]

[project.scripts]
eval-anything = "eval_anything.cli:main"
eval-harness = "eval_anything.cli:main"

[tool.setuptools.package-data]
eval_anything = ["*.yaml"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
