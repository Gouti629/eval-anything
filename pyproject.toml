[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Lightweight LLM evaluation harness"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.0",
    "tqdm",
    "numpy",
    "matplotlib",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["flash-attn>=2.5"]
test = ["pytest>=7.0"]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.package-data]
eval_harness = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
